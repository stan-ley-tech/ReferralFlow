name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: referralflow
          POSTGRES_USER: referralflow
          POSTGRES_PASSWORD: referralflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U referralflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgres://referralflow:referralflow@localhost:5432/referralflow
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Lint with flake8
        run: flake8 apps config tests

      - name: Check formatting with black
        run: black --check apps config tests

      - name: Run Django system checks
        run: python manage.py check

      - name: Run test suite
        run: pytest --cov=apps --cov-report=term-missing
